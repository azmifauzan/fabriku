services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fabriku
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-fabriku}
      - DB_USERNAME=${DB_USERNAME:-fabriku}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@fabriku.my.id}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Fabriku}
      - FORCE_MIGRATE=${FORCE_MIGRATE:-false}
      - FABRIKU_S3_ACCESS_KEY=${FABRIKU_S3_ACCESS_KEY}
      - FABRIKU_S3_SECRET_KEY=${FABRIKU_S3_SECRET_KEY}
      - FABRIKU_S3_BUCKET=${FABRIKU_S3_BUCKET}
      - FABRIKU_S3_ENDPOINT=${FABRIKU_S3_ENDPOINT}
      - FABRIKU_S3_URL=${FABRIKU_S3_URL}
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fabriku-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fabriku-network:
    driver: bridge
