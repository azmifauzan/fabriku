server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsfahomemade.com;

    ssl_certificate /etc/letsencrypt/live/dsfahomemade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsfahomemade.com/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://fabriku;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dsfahomemade.com;

    ssl_certificate /etc/letsencrypt/live/dsfahomemade.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsfahomemade.com/privkey.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    return 301 https://dsfahomemade.com$request_uri;
}
